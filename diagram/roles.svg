<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1a1a1a">
  <title>Roles: who works where, drawn from the setup assistant's side</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .h { font-weight: 700; font-size: 18px; }
      .s { font-size: 14.5px; fill: #333333; }
      .col { font-weight: 700; font-size: 16px; letter-spacing: 0.5px; fill: #555555; }
      .e { fill: none; stroke: #333333; stroke-width: 1.5; marker-end: url(#a); }
      .w { fill: none; stroke: #666666; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#a); }
      .no { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .lab { font-size: 13.5px; fill: #333333; font-style: italic; }
      .repo { fill: #fbf8ef; stroke: #8a7a4a; stroke-width: 1.5; }
      .sub { fill: #ffffff; stroke: #8a7a4a; stroke-width: 1.3; }
    </style>
  </defs>

  <text x="20" y="28" class="col">WHO</text>
  <text x="600" y="28" class="col">WHERE THE WORK LIVES</text>

  <!-- People and agents -->
  <rect x="20" y="42" width="400" height="88" rx="8" fill="#1a3a6b"/>
  <text x="40" y="72" class="h" fill="#ffffff">Levi Purdy</text>
  <text x="40" y="96" class="s" style="fill:#dbe4f2">the owner; alone approves anything public,</text>
  <text x="40" y="116" class="s" style="fill:#dbe4f2">money spent and mail sent as him</text>

  <rect x="20" y="180" width="400" height="96" rx="8" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.5"/>
  <text x="40" y="210" class="h">Forge</text>
  <text x="40" y="234" class="s">the setup assistant: a coding agent in Levi's</text>
  <text x="40" y="254" class="s">editor; his hands on the layer above Alpha</text>

  <rect x="20" y="340" width="400" height="96" rx="8" fill="#eef3fa" stroke="#1a3a6b" stroke-width="1.5"/>
  <text x="40" y="370" class="h">Alpha and its workers</text>
  <text x="40" y="394" class="s">the agent on chat and the coding sessions</text>
  <text x="40" y="414" class="s">it briefs; they change their own repository</text>

  <rect x="20" y="520" width="400" height="96" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="1.5"/>
  <text x="40" y="550" class="h">Supervisor</text>
  <text x="40" y="574" class="s">watches Alpha from outside its reach, can</text>
  <text x="40" y="594" class="s">freeze it; only Levi resumes it</text>

  <!-- Repositories -->
  <rect x="600" y="160" width="580" height="460" rx="10" class="repo"/>
  <text x="622" y="192" class="h">setup repository</text>
  <text x="622" y="216" class="s">the plan · Levi's decisions log, dated and append-only ·</text>
  <text x="622" y="236" class="s">notes on the laptop and each part · how work is done</text>

  <rect x="630" y="270" width="440" height="150" rx="8" class="sub"/>
  <text x="650" y="300" class="h">run repository</text>
  <text x="784" y="300" class="s" style="fill:#8a7a4a">(a submodule)</text>
  <text x="650" y="326" class="s">Alpha's persona, rules, skills, memory,</text>
  <text x="650" y="346" class="s">tracker and tools</text>
  <text x="650" y="380" class="s">Alpha may change it, through the merge gate;</text>
  <text x="650" y="400" class="s">what guards it waits for Levi's yes</text>

  <rect x="630" y="470" width="440" height="120" rx="8" class="sub"/>
  <text x="650" y="500" class="h">supervise repository</text>
  <text x="832" y="500" class="s" style="fill:#8a7a4a">(a submodule)</text>
  <text x="650" y="526" class="s">the supervisor's policy and its tools</text>
  <text x="650" y="560" class="s">Alpha never reads or writes it</text>

  <!-- Arrows -->
  <path d="M420,86 H890 V156" class="e"/>
  <text x="440" y="78" class="lab">his words, recorded verbatim</text>
  <path d="M220,130 V176" class="e" marker-start="url(#a)"/>
  <text x="230" y="160" class="lab">works with him directly</text>
  <path d="M420,214 H596" class="e"/>
  <text x="432" y="206" class="lab">works from here</text>
  <path d="M1125,250 V466" class="e"/>
  <text x="1140" y="360" class="lab" transform="rotate(90 1140 360)" text-anchor="middle">builds, deploys</text>
  <path d="M150,336 V280" class="e"/>
  <text x="38" y="310" class="lab">requests</text>
  <path d="M300,280 V336" class="e"/>
  <text x="310" y="312" class="lab">carried out, once Levi approves</text>
  <path d="M420,388 H626" class="e"/>
  <text x="440" y="380" class="lab">writes, under checks</text>
  <path d="M630,545 H424" class="e"/>
  <text x="450" y="537" class="lab">its policy and tools</text>
  <path d="M220,520 V440" class="w"/>
  <text x="230" y="484" class="lab">watches; can stop everything</text>
  <path d="M420,425 L626,500" class="no"/>
  <path d="M514,452 l12,12 M526,452 l-12,12" stroke="#b3261e" stroke-width="2.4"/>
  <text x="456" y="486" class="lab" style="fill:#b3261e">no access</text>

  <text x="20" y="668" class="s">Forge sits above both sides, so changing the safeguards is never something the guarded agent can do.</text>
  <text x="20" y="692" class="s">It holds none of Levi's accounts, approves nothing for him, and never answers a review question as him.</text>
</svg>
